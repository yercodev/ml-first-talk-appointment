name: Tests y publicacion en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Un contenedor postgres:16 con los roles de Supabase simulados (anon, authenticated, service_role y el
    # esquema `extensions` con pgcrypto) en vez de `supabase start`: arranca en segundos, no necesita bajar ~12
    # imagenes de Docker y prueba exactamente lo mismo (SQL, privilegios, concurrencia). Lo unico que no cubre es
    # la capa PostgREST (la traduccion de RAISE SQLSTATE 'PGRST' a un codigo HTTP), que se comprueba en la
    # prueba de humo contra staging.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (front + SQL contra Postgres 16, con la carrera de 10 conexiones)
        run: npm test
      - name: Ninguna clave service_role en el sitio
        run: node scripts/check-no-service-key.mjs site

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Armar el sitio con version.json
        env:
          ANON_KEY: ${{ vars.ML_ANON_KEY }}
        run: |
          set -euo pipefail
          rm -rf dist && cp -r site dist
          if [ -n "${ANON_KEY:-}" ]; then
            sed -i "s|PEGAR_ANON_KEY_STAGING|${ANON_KEY}|" dist/config.js
          fi
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
      - name: Sin claves peligrosas en el build
        run: node scripts/check-no-service-key.mjs dist
      - name: La clave anon tiene que estar puesta (solo al publicar)
        if: github.event_name != 'pull_request'
        run: |
          if grep -q "PEGAR_ANON_KEY_STAGING" dist/config.js; then
            echo "::error::Falta la clave anon de staging: define la variable de repositorio ML_ANON_KEY (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Prueba de humo (solo lectura) contra la pagina publicada y staging
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          ANON_KEY: ${{ vars.ML_ANON_KEY }}
          SUPABASE_URL: https://dojgxfotawtxitgcppyn.supabase.co
        run: |
          set -euo pipefail
          test -n "$ANON_KEY" || { echo "::error::Falta la variable ML_ANON_KEY"; exit 1; }
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          test "$code" = "200" || { echo "::error::La portada responde $code"; exit 1; }
          curl -fsS "${URL}version.json" -o version.json
          SHA=$(python3 -c 'import json; print(json.load(open("version.json"))["sha"])')
          test "$SHA" = "$GITHUB_SHA" || { echo "::error::version.json trae $SHA y se publico $GITHUB_SHA"; exit 1; }
          code=$(curl -s -o slots.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ml_slots"             -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -H "Content-Type: application/json" -d '{}')
          test "$code" = "200" || { echo "::error::ml_slots responde $code en staging (¿se aplico el SQL 0001?)"; exit 1; }
          SCHEMA=$(python3 -c 'import json; print(json.load(open("slots.json"))["schemaVersion"])')
          echo "schemaVersion en staging: $SCHEMA (el front espera 1)"
          test "$SCHEMA" -ge 1
          echo "### Publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL · commit $SHA · schemaVersion $SCHEMA" >> "$GITHUB_STEP_SUMMARY"
